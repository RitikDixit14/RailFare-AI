[theme]
base = "dark"
primaryColor = "#00E5FF"
backgroundColor = "#050B14"
secondaryBackgroundColor = "#0A1624"
textColor = "#E6F1FF"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
